replicaCount: 1

image:
  repository: "432004895948.dkr.ecr.us-east-1.amazonaws.com/aerolink-dev/flight-service"
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true
  name: flight-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::432004895948:role/aerolink-dev-flight-service-role

livenessProbe:
  httpGet:
    path: /api/v1/health/live
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: 3000
  initialDelaySeconds: 25
  periodSeconds: 10

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

migrations:
  enabled: true

env:
  # CORS allowlist (comma-separated). Per-environment placeholder — set to the
  # site URL(s). If removed/empty, services fall back to localhost (any port).
  - name: CORS_ORIGINS
    value: "https://transnova.online,http://localhost:5173"
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: AWS_REGION
    value: us-east-1
  - name: KAFKA_AUTH
    value: iam

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secrets:
    - secretKey: DATABASE_URL
      remoteRef: { key: /aerolink/dev/flight-service/db-url }
    - secretKey: KAFKA_BROKERS
      remoteRef: { key: /aerolink/dev/shared/kafka-brokers }
    - secretKey: REDIS_URL
      remoteRef: { key: /aerolink/dev/shared/redis-url }
